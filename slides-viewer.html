<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide — Sylla</title>
    <style>
      html, body { height: 100%; margin: 0; background: #faf8f3; font-family: ui-serif, Georgia, serif; }
      body { display: flex; flex-direction: column; }
      header { flex: none; padding: 14px 24px; border-bottom: 1px solid #e7e5e4; color: #57534e; font-size: 13px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      iframe { flex: 1; width: 100%; border: 0; background: #e7e5e4; }
      p { padding: 24px; color: #b91c1c; font-size: 14px; }
    </style>
  </head>
  <body>
    <header id="name"></header>
    <iframe id="pdf" title="Slide"></iframe>
    <script>
      const filePath = new URLSearchParams(location.search).get('path') || '';
      const name = filePath.split(/[\\/]/).pop();
      document.getElementById('name').textContent = name;
      if (/\.pdf$/i.test(filePath)) {
        document.getElementById('pdf').src = encodeURI('file://' + (filePath.startsWith('/') ? '' : '/') + filePath.replace(/\\/g, '/')).replace(/#/g, '%23');
      } else {
        document.getElementById('pdf').remove();
        document.body.insertAdjacentHTML('beforeend', '<p>Il file allegato non è un PDF.</p>');
      }
    </script>
  </body>
</html>
